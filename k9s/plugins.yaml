plugins:
  # See https://k9scli.io/topics/plugins/
  raw-logs-follow:
    shortCut: Ctrl-L
    description: logs -f
    scopes:
    - po
    command: kubectl
    background: false
    args:
    - logs
    - -f
    - $NAME
    - -n
    - $NAMESPACE
    - --context
    - $CONTEXT
  vim-logs:
    shortCut: Shift-L
    description: vimlogs
    scopes:
    - po
    - containers
    command: bash
    background: false
    args:
    - -c
    - |
      CONTAINER_ARG=""
      if [ -n "$POD" ]; then CONTAINER_ARG="-c $NAME" ; NN="$POD" ; else NN="$NAME" ; fi
      kubectl logs "$NN" $CONTAINER_ARG -n "$NAMESPACE" --context "$CONTEXT" | vim -c "set buftype=nofile" -
